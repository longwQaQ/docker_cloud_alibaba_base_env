name: 缺陷报告
description: 报告可复现的启动、配置或兼容性问题
title: "[Bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: 请先移除日志中的密码、令牌、数据库内容和其他敏感信息。
  - type: input
    id: environment
    attributes:
      label: 运行环境
      description: 操作系统、CPU 架构、Docker 和 Compose 版本
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 提供最小、可重复执行的命令和配置差异
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期结果
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际结果与脱敏日志
    validations:
      required: true
  - type: checkboxes
    id: security
    attributes:
      label: 安全确认
      options:
        - label: 我确认报告不包含凭证或未修复漏洞的利用细节
          required: true
